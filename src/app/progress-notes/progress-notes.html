<h2>Project Info</h2>

<form [formGroup]="progressNotesForm">
  <div>
    <label for="project-code">Project Code:</label>
    <input
      id="project-code"
      type="text"
      formControlName="projectCode"
      (blur)="updateProjectName()"
    />
    @if (projectCodeNotFound) {
      <p style="color: red">Project code not found.</p>
    }
  </div>
  <div>
    <label for="project-name">Project Name:</label>
    <input id="project-name" type="text" formControlName="projectName" />
  </div>

  <div>
    <label for="project-date">Project Date:</label>
    <input id="project-date" type="date" formControlName="projectDate" />
  </div>

  <div>
    <label for="project-status">Status:</label>
    <input id="project-status" type="text" formControlName="projectStatus" />
  </div>

  <div formGroupName="projectDetails">
    <h3>Project Notes</h3>

    <div>
      <label for="project-member">Member:</label>
      <input id="project-member" type="text" formControlName="projectMember" />
    </div>

    <div>
      <label for="project-note">Notes:</label>
      <input id="project-note" type="text" formControlName="projectNote" />
    </div>
  </div>
</form>

<br />

<label for="progress-note">Progress Note:</label>

<input id="progress-note" type="text" [(ngModel)]="progressNote" />

<p>Current Note: {{ progressNote }}</p>
